<!doctype html>

.pill.solid{background:#000;color:#fff;border-color:#000}

<body>

<div id="hud"><div id="hudTL" style="left:56px;top:44px">CINEMATY · HYDERABAD</div><div id="hudTR" style="right:56px;top:44px"></div><div id="hudBL" style="left:56px;bottom:40px"></div><div id="hudBR" style="right:56px;bottom:40px"></div></div>

<script>
const P=0.5,DUR=150,FPS=30;
const VERT=location.hash==='#v',W=VERT?1080:1920,H=VERT?1920:1080,CX=W/2,CY=H/2;
const VH={};
function V(el,dx,dy,z=1){if(!el||!el.parentNode)return;const g=document.createElement('div');g.className='vw';g.style.cssText=`position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:translate(${dx}px,${dy}px) scale(${z})`;el.parentNode.insertBefore(g,el);g.appendChild(el)}
function VA(w,dx,dy,z=1){[...w.children].filter(x=>!x.classList.contains('vw')).forEach(x=>V(x,dx,dy,z))}
function VC(c,dx,dy,z=1){V(c.cur.c,dx,dy,z);V(c.cur.r,dx,dy,z)}
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,x)=>a+(b-a)*x;
const ez={expo:x=>x>=1?1:1-Math.pow(2,-10*x),quart:x=>1-Math.pow(1-x,4),out:x=>1-Math.pow(1-x,3),
 inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,sine:x=>-(Math.cos(Math.PI*x)-1)/2,lin:x=>x,inn:x=>x*x*x,
 back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
 el:x=>x===0||x===1?x:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};
const tw=(t,a,d,e='expo')=>ez[e](cl((t-a)/d));
const kick=t=>{if(t<0)return 0;const f=(t/P)%1;return Math.exp(-f*9)};
function E(p,tag='div',cls='',css='',html=''){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html)e.innerHTML=html;if(p)p.appendChild(e);return e}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const tf=(el,s)=>{el.style.transform=s};
const op=(el,o)=>{el.style.opacity=o};
// reveal line
function RL(p,html,css,cls='serif'){const o=E(p,'div','rl a',css);return E(o,'div',cls,'',html)}
function rv(i,lt,s,d=.8){const e=tw(lt,s,d,'expo');tf(i,`translateY(${(1-e)*118}%) rotate(${(1-e)*3}deg)`);return e}
function rvOut(i,lt,s,d=.5){const e=tw(lt,s,d,'inOut');if(lt>=s)tf(i,`translateY(${-e*118}%)`);}

function av(p,ini,size,i=0,css=''){return E(p,'div','av',`width:${size}px;height:${size}px;font-size:${size*.32}px;background:${SH[i%SH.length]};${css}`,ini)}
function blurIn(el,lt,s,d=.5,from=14,sc=1.15){const e=tw(lt,s,d,'expo');el.style.opacity=cl(e*1.6);el.style.filter=e<1?`blur(${(1-e)*from}px)`:'none';return e}
// cursor
const CUR='<svg viewBox="0 0 24 24" width="40" height="40"><path d="M3 2 L3 19 L7.5 14.8 L10.6 21.5 L13.6 20.2 L10.6 13.6 L16.8 13.6 Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';
function mkCursor(p,ring='#000'){const c=E(p,'div','cursor','',CUR);const r=E(p,'div','ripple',`border-color:${ring}`);return {c,r}}
function moveCursor(o,lt,keys,clicks=[]){
 let x=keys[0][1],y=keys[0][2];
 for(let i=0;i<keys.length-1;i++){const[a,x1,y1]=keys[i],[b,x2,y2]=keys[i+1];if(lt>=a&&lt<b){const e=ez.inOut((lt-a)/(b-a));x=lerp(x1,x2,e);y=lerp(y1,y2,e);break}if(lt>=b){x=x2;y=y2}}
 const vis=cl((lt-keys[0][0]+.25)/.25);let s=1,rp=-1;for(const c of clicks){const d=lt-c;if(d>-.12&&d<.18)s=Math.min(s,1-.22*Math.sin(cl((d+.12)/.3)*Math.PI));if(d>=0&&d<.6)rp=d}
 o.c.style.opacity=vis;tf(o.c,`translate(${x-6}px,${y-4}px) scale(${s})`);
 if(rp>=0){const e=ez.out(rp/.6);o.r.style.opacity=1-e;tf(o.r,`translate(${x}px,${y}px) scale(${1+e*5})`)}else o.r.style.opacity=0;
}

const k1=(lt,s,d=.25)=>{const x=lt-s;return x<0?0:Math.exp(-x/d*3)};// impulse decay

function S(a,b,bg,build,update,opt={}){scenes.push({a,b,bg,build,update,opt})}

 const open=tw(lt,1.3,1.2,'inOut');const slam=ez.inn(cl((lt-3.3)/.2));let a=-30*open*(1-slam);
 if(lt>3.5)a=-3*Math.exp(-(lt-3.5)*10)*Math.cos((lt-3.5)*50);

},(lt,c,t)=>{
 const i=Math.min(7,Math.floor(lt/.5)),f=lt-i*.5,e=tw(f,0,.3,'expo');
 c.w.innerHTML=c.words[i];

 const sc=last?lerp(1.25,1,e)+f*.06:lerp(1.3,1,e);
 tf(c.w,`scale(${sc}) rotate(${(i%2?1:-1)*(1-e)*3}deg) translateY(${(1-e)*30}px)`);c.w.style.filter=e<.95?`blur(${(1-e)*16}px)`:'none';
 c.n.textContent=`0${i+1} / 08`;tf(c.bar,`scaleX(${(lt)/4})`);

S(8,16,'paper',(w,c)=>{
 const T=['anyone know a DOP free this weekend??','need sound recordist urgent 🙏','who is editing shorts these days?','is there a colorist under budget?','any screening for my short?','festival deadline is when??','looking for actors, Telugu','who has a gimbal to rent','mentor for first feature?','location permit Charminar??','sound guy cancelled 😭','share if you know anyone','anyone? anyone?','DM me','need crew by Friday','still looking…','pls RT','help'];
 const r=rng(7);c.b=T.map((s,i)=>{const x=VERT?40+r()*440:120+r()*1300,y=VERT?140+r()*1650:110+r()*820;const el=E(w,'div','a sans',`left:${x}px;top:${y}px;background:#F0F0F0;border-radius:28px 28px 28px 6px;padding:18px 26px;font-size:${26+r()*8}px;white-space:nowrap;color:#2b2b2b`,s);return{el,x,y,ph:r()*6}});
 c.cnt=E(w,'div','pill red a','right:120px;top:110px;font-size:20px','UNREAD 0');

},(lt,c)=>{
 const col=tw(lt,4,.8,'inOut');
 c.b.forEach((b,i)=>{const s=i*.22,e=tw(lt,s,.45,'back');const fy=Math.sin(lt*1.4+b.ph)*8;
  const x=lerp(0,CX-b.x-150,col),y=lerp(fy,CY-b.y-30,col);op(b.el,cl(tw(lt,s,.2,'lin'))*(1-col));tf(b.el,`translate(${x}px,${y}px) scale(${lerp(.3,1,e)*(1-col*.8)})`)});
 const n=Math.min(99,Math.floor(cl(lt/4)*99));c.cnt.textContent=n>=99?'UNREAD 99+':'UNREAD '+n;op(c.cnt,1-col);
 // iris radius steps

 for(const[s,a,b]of steps){if(lt>=s)R=lerp(a,b,tw(lt,s,.28,'expo'))}
 c.iris.style.webkitMaskImage=`radial-gradient(circle at 50% 50%, transparent ${R}px, #000 ${R+1}px)`;
 c.ring.style.cssText+=`;width:${R*2+60}px;height:${R*2+60}px;margin:${-R-30}px 0 0 ${-R-30}px;transform:rotate(${lt*30}deg);opacity:${lt>4.4&&R>5?1:0}`;
 const qe=tw(lt,4.6,.8);op(c.q,qe*(1-tw(lt,6.3,.3,'lin')));tf(c.q,`scale(${lerp(1.1,1,qe)*(1-tw(lt,5.5,1,'inOut')*.25)})`);c.q.style.filter=`blur(${(1-qe)*10}px)`;
},{noIn:1,noOut:1});

// 4. Logo drop 16-20
S(16,20,'ink',(w,c)=>{
 c.beam=E(w,'div','a','left:460px;top:-100px;width:1000px;height:1300px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 80%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);transform-origin:50% 0');
 for(const y of [40,1000]){const s=E(w,'div','a',`left:-200px;top:${y}px;width:2400px;height:40px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 26px,transparent 26px 60px);border-radius:4px`);(c.perf=c.perf||[]).push(s)}
 c.lg=[];for(let i=0;i<3;i++){c.lg.push(E(w,'div','a',`left:${960-430}px;top:170px;width:860px;color:#fff;opacity:${i?0.3:1}`,LOGO))}
 const tl=c.tl=E(w,'div','a row','left:0;right:0;top:700px;justify-content:center;gap:.25em;font-size:110px');c.words=['Where','Hyderabad’s','films','<i>begin.</i>'].map(t=>{const o=E(tl,'div','rl');return E(o,'div','serif','',t)});
 c.m=E(w,'div','mono a','left:0;right:0;top:860px;text-align:center;font-size:22px','');
},(lt,c,t)=>{
 const e=tw(lt,0,.9,'expo');
 c.lg.forEach((l,i)=>{const off=(i===0?0:(i===1?1:-1))*(1-tw(lt,0,.6))*40;tf(l,`translateX(${off}px) scale(${lerp(1.5,1,e)})`);l.style.filter=e<1?`blur(${(1-e)*20}px)`:'none';if(i)op(l,.35*(1-tw(lt,0,.6,'lin')))});
 op(c.lg[0],cl(e*2));
 c.words.forEach((x,i)=>rv(x,lt,1+i*.5,.7));
 const m=tw(lt,3,.8);op(c.m,m);c.m.style.letterSpacing=lerp(.8,.3,m)+'em';
 tf(c.beam,`rotate(${Math.sin(lt*1.3)*6}deg)`);op(c.beam,.7+Math.sin(lt*37)*.08+.25*kick(t));
 c.perf.forEach((p,i)=>tf(p,`translateX(${-(lt*120)%60*(i?1:-1)}px)`));
},{noIn:1});

// 5. Feed 20-26
S(20,26,'ink',(w,c)=>{
 c.mq=marquee(w,'FEED · POSTS · POLLS · ','left:0;top:820px;font-family:IS;font-size:300px;color:#fff;opacity:.1;-webkit-text-stroke:2px #fff;color:transparent');
 c.h=[RL(w,'Your city’s','left:130px;top:250px;font-size:128px'),RL(w,'film set,','left:130px;top:380px;font-size:128px'),RL(w,'<i>in one feed.</i>','left:130px;top:510px;font-size:128px')];
 const tabs=E(w,'div','row mono a','left:134px;top:700px;font-size:20px;gap:44px');c.tabs=['For You','Following','Saved'].map(s=>E(tabs,'div','','',s));
 c.ul=E(w,'div','a','left:134px;top:736px;height:3px;background:#fff;width:100px');
 const pers=E(w,'div','a','left:930px;top:0;width:820px;height:1080px;perspective:1700px');
 c.col=E(pers,'div','a','left:0;top:0;width:760px;transform-style:preserve-3d');
 const post=(name,ini,role,tag,text,extra,h,ai)=>{const p=E(c.col,'div','card a',`left:0;width:760px;height:${h}px;padding:34px 38px`);
  const hd=E(p,'div','row','gap:16px');av(hd,ini,62,ai);const nm=E(hd,'div','sans','font-size:23px;font-weight:600',name+`<div style="font-weight:400;color:#6B6B6B;font-size:18px;margin-top:2px">${role}</div>`);
  E(p,'div','pill solid','margin:22px 0 16px;font-size:13px',tag);E(p,'div','sans','font-size:25px;line-height:1.38',text);const ex=E(p,'div','','margin-top:20px');extra&&extra(ex);
  const rx=E(p,'div','row mono a','left:38px;bottom:28px;gap:30px;font-size:16px;color:#4a4a4a');const cn=['Like','Appreciate','Collab'].map(s=>{const d=E(rx,'div','row','gap:8px');E(d,'span','','',s);return E(d,'b','','color:#000',0)});return{p,cn,h,ex}};
 c.polls=[];
 c.posts=[
  post('Syed Ali Hussaini','SA','Writer · 1d ago','Discussion · Poll','Still arguing about the last scene of <b>Request Hour</b>. Night seven, 2 a.m., the phone rings again. What happens?',ex=>{['He plays the requested song','The line goes dead mid-song','The caller finally speaks','We never find out'].forEach((s,i)=>{const r=E(ex,'div','a','');const b=E(ex,'div','','position:relative;height:46px;border:1.5px solid #E8E8E8;border-radius:12px;margin-bottom:10px;overflow:hidden');const f=E(b,'div','a',`left:0;top:0;bottom:0;background:${i===2?'#000':'#E8E8E8'};width:0`);const l=E(b,'div','a sans',`left:16px;top:10px;font-size:19px;color:${i===2?'#fff':'#000'};mix-blend-mode:${i===2?'difference':'normal'}`,s);c.polls.push({f,v:[30,10,50,10][i]})})},640,0),
  post('Ananya Rao','AR','Director · 3d ago','Project announcement','<b>Offbeat</b> is officially crewing up. Casting two leads — and crew who aren’t scared of Tank Bund at 2 a.m.',ex=>{const b=E(ex,'div','','border:1.5px solid #E8E8E8;border-radius:14px;padding:20px 22px');E(b,'div','mono','font-size:14px;color:#6B6B6B','Project · Feature · Pre-production');E(b,'div','serif','font-size:52px;margin:8px 0','Offbeat');E(b,'div','pill','font-size:13px','3 open roles')},560,1),
  post('Ravi Teja Kommineni','RT','DOP · 1d ago','Production update','Day 3 of 6 on <b>Boulder Girls</b>. Golden hour on the Khajaguda rocks — the whole crew went quiet for the last take.',ex=>{E(ex,'div','','height:210px;border-radius:14px;background:radial-gradient(ellipse at 70% 20%,#d1d1d1,#4a4a4a 45%,#191919 80%);position:relative;overflow:hidden','<div style="position:absolute;left:0;right:0;bottom:0;height:90px;background:#000;clip-path:polygon(0 60%,18% 20%,35% 55%,52% 10%,70% 50%,85% 25%,100% 55%,100% 100%,0 100%)"></div>')},600,2)];
 let y=0;c.posts.forEach(p=>{p.y=y;p.p.style.top=y+'px';y+=p.h+34});
 c.chips=[];const r=rng(3);for(let i=0;i<10;i++){c.chips.push({el:E(w,'div','pill inv a',`left:${1500+r()*260}px;top:${300+r()*500}px;font-size:16px`,['♥ Like','✦ Appreciate','⇄ Collab'][i%3]),s:.4+i*.5})}
