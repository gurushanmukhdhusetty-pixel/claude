<script>
const FPS=30,DUR=33.12;
const BEATS=[0.28,0.95,1.63,2.3,2.995,3.68,4.354,5.039,5.712,6.385,7.07,7.755,8.44,9.102,9.799,10.484,11.169,11.842,12.516,13.212,13.886,14.571,15.256,15.952,16.625,17.299,17.995,18.669,19.354,20.039,20.712,21.444,22.071,22.756,23.441,24.126,24.811,25.484,26.18,26.854,27.539,28.201,28.897,29.582,30.267,30.941,31.61,32.28];
const HITS=[0.06,5.71,7.07,7.63,8.12,8.43,8.78,9.1,9.8,10.34,11.16,12.71,13.05,13.2,14.57,15.12,15.26,15.45,15.6,15.81,15.95,16.61,18.32,18.67,19.02,19.2,19.35,19.69,19.89,20.03,20.71,22.07,22.27,22.43,22.76,23.29,23.44,23.78,24.46,24.66,24.81,25.33,25.47,25.81,26.18,26.35,26.85,27.09,27.86,28.2,29.23,29.93,30.26,30.6,30.93,31.61,31.96];
const D1=6.385,BR1=15.0,D2=16.625,BR2=21.444,D3=22.071,BR3=26.0,D4=28.201;
const DROPS=[D1,D2,D3,D4];
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,x)=>a+(b-a)*x;
const ez={expo:x=>x>=1?1:1-Math.pow(2,-10*x),back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,out:x=>1-Math.pow(1-x,3),inn:x=>x*x*x};
const tw=(t,a,d,e='expo')=>ez[e](cl((t-a)/d));
const $=id=>document.getElementById(id);
const tf=(el,s)=>{el.style.transform=s},op=(el,o)=>{el.style.opacity=o};
const kick=t=>{let b=-1;for(const x of BEATS){if(x<=t)b=x;else break}if(b<0)return 0;return Math.exp(-(t-b)*12)};
const hitk=t=>{let b=-9;for(const x of HITS){if(x<=t)b=x;else break}return Math.exp(-(t-b)*14)};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function E(p,tag,css,html){const e=document.createElement(tag);if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;p.appendChild(e);return e}
// word reveal helper: [time, html, extra-css]
function words(host,list,base){return list.map(([t,h,css])=>({t,el:E(host,'div',base+(css||''),h)}))}
const G=[];
function init(logo){
 const L=logo.replace(/style="color:[^"]*"/,'').replace(/width="[^"]*"/,'width="100%"').replace(/height="[^"]*"/,'height="auto"');
 $('ilogo').innerHTML=L;$('f_logo').innerHTML=L;
 for(let i=0;i<6;i++){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),d=x.createImageData(256,256),r=rng(i+3);for(let j=0;j<d.data.length;j+=4){const v=r()*255;d.data[j]=d.data[j+1]=d.data[j+2]=v;d.data[j+3]=255}x.putImageData(d,0,0);G.push(c.toDataURL())}
 const vf=$('vf');[[0,0,'left','top'],[1,0,'right','top'],[0,1,'left','bottom'],[1,1,'right','bottom']].forEach(([x,y,a,b])=>E(vf,'div',`position:absolute;${a}:0;${b}:0;width:100px;height:100px;border-${a}:5px solid #fff;border-${b}:5px solid #fff`));
 window.SW=words($('iw'),[[3.95,'Introducing'],[4.354,'the founders'],[5.039,'of'],[5.712,'<i>Cinematy.</i>']],'position:absolute;left:0;right:0;top:0;opacity:0;');
 const cap=$('d_cap');window.DL=[[[0.00,'You'],[0.86,'know'],[1.04,'the'],[1.20,'<i>business.</i>']],[[2.24,'And'],[2.88,'I'],[3.16,'know'],[3.34,'the'],[3.52,'<i>chemistry.</i>']]].map((line,li)=>{const row=E(cap,'div','position:absolute;left:0;right:0;bottom:0;opacity:0','');const inner=E(row,'span','display:inline;font-family:IS;font-size:110px;line-height:1.05;color:#fff;background:rgba(0,0,0,.72);padding:4px 22px 14px;box-decoration-break:clone;-webkit-box-decoration-break:clone','');return{row,w:line.map(([t,h])=>({t,el:E(inner,'span','opacity:.18',h+' ')}))}});
 window.STAG=[[7.07,'Entrepreneur','solid'],[7.755,'Founder',''],[8.44,'Writer','']].map(([t,s,k])=>({t,el:E($('s_tags'),'div','opacity:0',`<span class="pill ${k}">${s}</span>`)}));
 window.SL=words($('s_line'),[[10.484,'Knows'],[11.169,'the'],[11.842,'<i>business.</i>']],'display:inline-block;margin:0 .22em 0 0;opacity:0;font-family:IS;font-size:100px;color:#fff;');
 const fl=$('s_float');window.SF=[[12.71,'Plan',160,1150],[13.05,'Pitch',720,1000],[13.2,'Build',140,1420],[13.886,'Scale',740,1360],[14.571,'Ship',420,880]].map(([t,s,x,y])=>({t,el:E(fl,'div',`position:absolute;left:${x}px;top:${y}px;opacity:0`,`<span class="pill dark" style="font-size:28px;border-color:#fff">${s}</span>`)}));
 window.RTAG=[[17.299,'Co-founder','dark'],[17.995,'Actor',''],[18.669,'Filmmaker','']].map(([t,s,k])=>({t,el:E($('r_tags'),'div','opacity:0',`<span class="pill ${k}">${s}</span>`)}));
 window.RL=words($('r_line'),[[19.354,'Knows'],[20.039,'the'],[20.712,'<i>chemistry.</i>']],'display:inline-block;margin:0 .22em 0 0;opacity:0;font-family:IS;font-size:100px;color:#000;');
 window.BEQ=E($('b_eq'),'div','opacity:0','<span class="serif" style="font-size:104px;color:#fff;background:#000;padding:4px 30px 16px;border-radius:24px;border:3px solid #fff">= <i>Cinematy.</i></span>');
 window.TW=[[26.18,'Building'],[26.854,'Hyderabad’s'],[27.539,'film <i>community.</i>']];
 window.FCAP=E($('f_cap'),'div','opacity:0','<span class="mono" style="font-size:30px">Shanmukh · Founder&nbsp;&nbsp;&nbsp;Raagin · Co-founder</span>');
 window.FCTA=E($('f_cta'),'div','opacity:0','<span class="pill" style="font-size:30px"><span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:#D92D20;margin-right:14px;vertical-align:1px"></span>Coming soon · cinematy.in</span>');
}
function show(id,on){$(id).style.display=on?'block':'none'}
function slam(el,t,s,d=.35,from=1.5){const e=tw(t,s,d,'expo');op(el,t<s?0:1);tf(el,`scale(${lerp(from,1,e)})`);el.style.filter=(t>=s&&e<1)?`blur(${(1-e)*16}px)`:'none';return e}
function render(t){
 // which layer
 const lay=t<3.84?'L_dia':t<D1?'L_intro':t<BR1?'L_s':t<D2?'L_swap':t<BR2?'L_r':t<D3?'L_swap':t<BR3?'L_both':t<D4?'L_ten':'L_fin';
 ['L_dia','L_intro','L_s','L_swap','L_r','L_both','L_ten','L_fin'].forEach(id=>show(id,id===lay));
 // ---------- DIALOGUE ----------
 if(lay==='L_dia'){
  const li=t<2.0?0:1;const sh=li===0;
  op($('d_s'),sh?1:0);op($('d_r'),sh?0:1);
  const e=tw(t,sh?0:2.0,.5);tf(sh?$('d_s'):$('d_r'),`scale(${lerp(1.08,1,e)+(t-(sh?0:2.0))*.02})`);
  $('L_dia').style.background='#000';op($('d_spot'),.7+.3*Math.sin(t*3));op($('d_tag'),tw(t,.2,.6));
  DL.forEach((L,i)=>{op(L.row,i===li?1:0);L.w.forEach(w=>{w.el.style.opacity=t>=w.t?1:.18})});
 }
 // ---------- INTRO ----------
 if(lay==='L_intro'){
  const f=Math.floor(t*30);$('tc').textContent=`00:00:${String(Math.floor(t)).padStart(2,'0')}:${String(f%30).padStart(2,'0')}`;op($('rec'),Math.floor(t*2)%2?1:.35);
  const le=tw(t,3.84,.5);op($('ilogo'),le);tf($('ilogo'),`scale(${lerp(1.2,1,le)})`);
  let cur=-1;SW.forEach((w,i)=>{if(t>=w.t)cur=i});SW.forEach((w,i)=>{const on=i===cur;op(w.el,on?1:0);if(on){const e=tw(t,w.t,.3);tf(w.el,`scale(${lerp(1.4,1,e)})`);w.el.style.filter=e<1?`blur(${(1-e)*12}px)`:'none'}});
  op($('isub'),tw(t,4.6,.6));
  const sq=tw(t,5.75,.6,'inn');tf($('vf'),`scale(${1-sq*.25})`);
 }
 // ---------- SHANMUKH ----------
 if(lay==='L_s'){
  const lt=t-D1;const e=tw(t,D1,.55,'expo');
  tf($('s_img'),`translateY(${(1-e)*700}px) scale(${1+.02*kick(t)})`);
  op($('s_spot'),.6+.4*kick(t));
  tf($('s_big'),`translateX(${-lt*60}px)`);
  STAG.forEach(s=>{const k=tw(t,s.t,.3,'back');op(s.el,t<s.t?0:1);tf(s.el,`translateX(${(1-cl(k))*-400}px)`)});
  slam($('s_name'),t,9.102,.45,1.25);
  SL.forEach(w=>{const k=tw(t,w.t,.35);op(w.el,t<w.t?0:1);tf(w.el,`translateY(${(1-k)*80}px)`);w.el.style.filter=t>=w.t&&k<1?`blur(${(1-k)*10}px)`:'none'});
  SF.forEach(s=>{const k=tw(t,s.t,.3,'back');op(s.el,t<s.t?0:1-tw(t,14.75,.25,'out'));tf(s.el,`scale(${cl(k)}) rotate(${(1-cl(k))*-12}deg)`)});
  const push=tw(t,12.5,2.5,'inOut');$('s_img').style.transformOrigin='50% 20%';
  if(push>0)tf($('s_img'),`scale(${1+push*.18+.02*kick(t)})`);
  // fade tags & line away during push for clean face
 }
 // ---------- SWAP (both breaks) ----------
 if(lay==='L_swap'){
  const br1=t<D2;const hits=HITS.filter(h=>br1?(h>=BR1&&h<D2):(h>=BR2&&h<D3));
  let n=0;hits.forEach(h=>{if(t>=h)n++});const sRaagin=n%2===1;

 if(lay==='L_r'){

 // ---------- BOTH ----------
 if(lay==='L_both'){
  const e=tw(t,D3,.5);tf($('b_white'),`translateX(${(1-e)*540}px)`);
  const es=tw(t,D3,.55),er=tw(t,D3+.12,.55);tf($('b_s'),`translateY(${(1-es)*900}px) scale(${1+.02*kick(t)})`);tf($('b_r'),`translateY(${(1-er)*900}px) scale(${1+.02*kick(t)})`);
  slam($('b_l'),t,22.756,.35,1.4);slam($('b_x'),t,23.441,.3,2);slam($('b_rt'),t,24.126,.35,1.4);
  const q=slam(BEQ,t,24.811,.4,1.5);

 // ---------- TENSION ----------
 if(lay==='L_ten'){
  let cur=-1;TW.forEach((w,i)=>{if(t>=w[0])cur=i});
